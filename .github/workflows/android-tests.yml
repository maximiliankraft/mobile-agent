name: Android tests

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure shared APK signing key
        env:
          MOBILE_AGENT_KEYSTORE_BASE64: ${{ secrets.MOBILE_AGENT_KEYSTORE_BASE64 }}
          MOBILE_AGENT_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_AGENT_KEYSTORE_PASSWORD }}
          MOBILE_AGENT_KEY_ALIAS: ${{ secrets.MOBILE_AGENT_KEY_ALIAS }}
          MOBILE_AGENT_KEY_PASSWORD: ${{ secrets.MOBILE_AGENT_KEY_PASSWORD }}
        run: |
          if [ -z "$MOBILE_AGENT_KEYSTORE_BASE64" ] \
            && [ -z "$MOBILE_AGENT_KEYSTORE_PASSWORD" ] \
            && [ -z "$MOBILE_AGENT_KEY_ALIAS" ] \
            && [ -z "$MOBILE_AGENT_KEY_PASSWORD" ]; then
            echo "::warning::Shared signing secrets are not configured; this debug APK will use the runner's temporary key."
            exit 0
          fi

          if [ -z "$MOBILE_AGENT_KEYSTORE_BASE64" ] \
            || [ -z "$MOBILE_AGENT_KEYSTORE_PASSWORD" ] \
            || [ -z "$MOBILE_AGENT_KEY_ALIAS" ] \
            || [ -z "$MOBILE_AGENT_KEY_PASSWORD" ]; then
            echo "::error::All four shared signing secrets must be configured together."
            exit 1
          fi

          keystore="$RUNNER_TEMP/mobile-agent-signing.jks"
          printf '%s' "$MOBILE_AGENT_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "MOBILE_AGENT_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        env:
          MOBILE_AGENT_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_AGENT_KEYSTORE_PASSWORD }}
          MOBILE_AGENT_KEY_ALIAS: ${{ secrets.MOBILE_AGENT_KEY_ALIAS }}
          MOBILE_AGENT_KEY_PASSWORD: ${{ secrets.MOBILE_AGENT_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mobile-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
